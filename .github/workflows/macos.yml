name: macOS
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/make_macos_strings.py --check
      - run: ./build-macos.sh
      - run: build/TLIV.app/Contents/MacOS/TLIV --self-test
      - run: plutil -lint build/TLIV.app/Contents/Info.plist
      - run: codesign --verify --deep --strict build/TLIV.app
      - run: ditto -c -k --sequesterRsrc --keepParent build/TLIV.app build/TLIV-macos.zip
      - run: ./package-macos.sh --skip-build
      - uses: actions/upload-artifact@v4
        with:
          name: TLIV-macos
          path: |
            build/TLIV-macos.zip
            build/TLIVSetup.dmg
